# 通用 Windows 自动构建工作流
# 功能：PyInstaller 打包 cli/desktop + InnoSetup 生成 install.exe + 自动发布 Releases
name: Windows Universal Build

# 触发规则：指定分支推送 / 手动运行
on:
  push:
    branches: ["main", "master", "feat/windows-build"]
  workflow_dispatch: # 支持网页手动点击构建

jobs:
  windows-build:
    runs-on: windows-latest
    # 开启仓库写入权限，用于创建 Release、上传文件
    permissions:
      contents: write

    steps:
      # 1. 拉取当前项目完整代码
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # 2. 通用 Python 环境
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. 通用依赖安装：自动装 pyinstaller + 项目 requirements.txt
      - name: Install Global Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # 存在依赖文件则自动安装
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }

      # 4. 通用构建 CLI 版本（无窗口控制台程序）
      - name: Build CLI.exe
        shell: pwsh
        run: |
          # 固定入口 src/open_codex/main.py 通用路径
          pyinstaller --onefile src/open_codex/main.py -n cli

      # 5. 通用构建 Desktop 桌面版（GUI 无黑框）
      - name: Build Desktop.exe
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed src/open_codex/main.py -n desktop

      # 6. 统一整理所有编译产物到 dist_final 目录
      - name: Organize Build Artifacts
        shell: pwsh
        run: |
          # 创建统一输出文件夹
          New-Item -ItemType Directory -Force -Path "dist_final"
          # 复制编译好的 exe 到统一目录
          Copy-Item -Path "dist/cli.exe" -Destination "dist_final/" -Force
          Copy-Item -Path "dist/desktop.exe" -Destination "dist_final/" -Force

      # 7. 动态生成 InnoSetup 安装脚本（通用模板，自动读取仓库名）
      - name: Auto Generate Inno Setup Script
        shell: pwsh
        run: |
          $repoName = "${{ github.event.repository.name }}"
          $issContent = @"
[Setup]
AppName=$repoName
AppVersion=1.0
DefaultDirName={pf}\$repoName
OutputDir=dist_final
OutputBaseFilename=install
Compression=lzma2/fast
SolidCompression=yes
PrivilegesRequired=admin
UninstallDisplayIcon={app}\desktop.exe
DisableProgramGroupPage=yes

[Files]
Source: "dist_final\desktop.exe"; DestDir: "{app}"; Flags: ignoreversion
Source: "dist_final\cli.exe"; DestDir: "{app}"; Flags: ignoreversion

[Icons]
Name: "{commondesktop}\$repoName 桌面版"; Filename: "{app}\desktop.exe"
Name: "{commonprograms}\$repoName\命令行工具"; Filename: "{app}\cli.exe"

[UninstallDelete]
Type: dirifempty; Name: "{app}"
"@
          # 写入临时安装脚本
          $issContent | Out-File -FilePath "temp_install.iss" -Encoding utf8

      # 8. 编译生成 install.exe 安装程序
      - name: Compile install.exe Installer
        uses: jonathanpoelen/innosetup-action@v1
        with:
          script: ./temp_install.iss

      # 9. 持久化构建产物（网页可下载备份）
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build-All
          path: dist_final/

      # 10. 自动创建 Release 标签与页面
      - name: Create Auto Release
        id: create_auto_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 通用标签：仓库名+运行编号，不重复
          tag_name: ${{ github.event.repository.name }}-build-${{ github.run_number }}
          release_name: ${{ github.event.repository.name }} Windows 构建 #${{ github.run_number }}
          draft: false
          prerelease: false

      # 11. 自动上传 cli.exe 到 Releases
      - name: Upload cli.exe To Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_auto_release.outputs.upload_url }}
          asset_path: dist_final/cli.exe
          asset_name: cli.exe
          asset_content_type: application/octet-stream

      # 12. 自动上传 desktop.exe 到 Releases
      - name: Upload desktop.exe To Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_auto_release.outputs.upload_url }}
          asset_path: dist_final/desktop.exe
          asset_name: desktop.exe
          asset_content_type: application/octet-stream

      # 13. 自动上传 install.exe 安装版到 Releases
      - name: Upload install.exe Installer To Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_auto_release.outputs.upload_url }}
          asset_path: dist_final/install.exe
          asset_name: install.exe
          asset_content_type: application/octet-stream
