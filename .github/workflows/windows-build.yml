name: Windows Universal Build

on:
  push:
    branches: ["main", "master", "feat/windows-build"]
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }

      - name: Build CLI.exe
        shell: pwsh
        run: |
          pyinstaller --onefile src/open_codex/main.py -n cli

      - name: Build Desktop.exe
        shell: pwsh
        run: |
          pyinstaller --onefile src/open_codex/main.py -n desktop

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist_final"
          if (Test-Path "dist/cli.exe") { Copy-Item -Path "dist/cli.exe" -Destination "dist_final/cli.exe" }
          if (Test-Path "dist/desktop.exe") { Copy-Item -Path "dist/desktop.exe" -Destination "dist_final/desktop.exe" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Generate Inno Setup Script
        shell: pwsh
        run: |
          $repoName = "${{ github.event.repository.name }}"
          $issContent = @(
            "[Setup]",
            "AppName=$repoName",
            "AppVersion=1.0",
            "DefaultDirName={pf}\$repoName",
            "OutputDir=dist_final",
            "OutputBaseFilename=install",
            "Compression=lzma2/fast",
            "SolidCompression=yes",
            "PrivilegesRequired=admin",
            "UninstallDisplayIcon={app}\desktop.exe",
            "DisableProgramGroupPage=yes",
            "",
            "[Files]",
            'Source: "dist_final\desktop.exe"; DestDir: "{app}"; Flags: ignoreversion',
            'Source: "dist_final\cli.exe"; DestDir: "{app}"; Flags: ignoreversion',
            "",
            "[Icons]",
            "Name: `"{commondesktop}\$repoName 桌面版`"; Filename: `"{app}\desktop.exe`"",
            "Name: `"{commonprograms}\$repoName\命令行工具`"; Filename: `"{app}\cli.exe`"",
            "",
            "[UninstallDelete]",
            "Type: dirifempty; Name: `"{app}`""
          )
          $issContent -join "`n" | Out-File -FilePath "temp_install.iss" -Encoding utf8

      - name: Compile install.exe
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" temp_install.iss

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build-All
          path: dist_final/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.repository.name }}-build-${{ github.run_number }}
          name: ${{ github.event.repository.name }} Windows 构建 #${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            dist_final/cli.exe
            dist_final/desktop.exe
            dist_final/install.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
